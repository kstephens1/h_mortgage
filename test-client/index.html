<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatHSBC MCP Test Client</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="Mortgage chat workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">ChatHSBC MCP</p>
            <h1>Mortgage Test Chat</h1>
          </div>
          <div class="connection">
            <label for="endpoint">Endpoint</label>
            <input id="endpoint" name="endpoint" type="url" value="http://127.0.0.1:8787/mcp" />
            <button id="connect-button" type="button">Connect</button>
          </div>
        </header>

        <div class="content-grid">
          <section class="chat-panel" aria-label="Chat">
            <div id="chat-log" class="chat-log" aria-live="polite"></div>
            <form id="chat-form" class="composer">
              <div class="composer-entry">
                <div
                id="message-input"
                name="message"
                class="message-input is-empty"
                contenteditable="true"
                role="textbox"
                aria-multiline="false"
                autocomplete="off"
                aria-label="Chat message"
                data-placeholder="Ask about a mortgage, or type @ to add HSBC Mortgages"
                ></div>
                <div id="mention-menu" class="mention-menu" role="listbox" aria-label="Available apps" hidden>
                  <button id="hsbc-mention-option" type="button" class="mention-option" role="option" aria-selected="false">
                    <img src="/assets/hsbc-logo.png" alt="" />
                    <span><strong>HSBC Mortgages</strong><small>Explore what you could borrow</small></span>
                  </button>
                </div>
              </div>
              <button id="sample-button" type="button">Sample</button>
              <button type="submit">Send</button>
            </form>
          </section>

          <aside class="side-panel" aria-label="Mortgage inputs and MCP details">
            <section class="panel-section">
              <div class="section-heading">
                <h2>Mortgage Details</h2>
                <button id="calculate-button" type="button">Run Tool</button>
              </div>
              <form id="mortgage-form" class="field-grid">
                <label>
                  <span>Loan Amount</span>
                  <input id="loan-amount" name="loanAmount" type="number" min="1" step="1000" value="250000" />
                </label>
                <label>
                  <span>Rate Percent</span>
                  <input id="interest-rate" name="annualInterestRatePercent" type="number" min="0" step="0.01" value="5" />
                </label>
                <label>
                  <span>Term Years</span>
                  <input id="term-years" name="termYears" type="number" min="1" step="1" value="25" />
                </label>
                <label>
                  <span>Overpayment</span>
                  <input id="monthly-overpayment" name="monthlyOverpayment" type="number" min="0" step="25" value="200" />
                </label>
              </form>
            </section>

            <section class="panel-section">
              <div class="section-heading">
                <h2>Connection</h2>
                <span id="status-pill" class="status-pill" data-status="idle">Idle</span>
              </div>
              <dl class="status-list">
                <div>
                  <dt>MCP</dt>
                  <dd id="server-name">Not connected</dd>
                </div>
                <div>
                  <dt>Tool</dt>
                  <dd id="tool-name">calculate_mortgage_repayment</dd>
                </div>
              </dl>
            </section>

            <section class="panel-section result-section">
              <div class="section-heading">
                <h2>Last Result</h2>
                <button id="clear-button" type="button">Clear</button>
              </div>
              <div id="result-metrics" class="metrics empty-state">No result yet</div>
              <details>
                <summary>Raw JSON</summary>
                <pre id="raw-output">{}</pre>
              </details>
            </section>
          </aside>
        </div>
      </section>
    </main>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
