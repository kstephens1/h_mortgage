<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatHSBC</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="login-screen" class="login-screen">
      <section class="login-card" aria-labelledby="login-title">
        <img src="/assets/hsbc-logo.png" alt="" />
        <p class="login-eyebrow">Private access</p>
        <h1 id="login-title">Sign in to Chat‑H</h1>
        <p class="login-copy">Enter your authorised credentials to continue.</p>
        <form id="login-form">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <p id="login-error" class="login-error" role="alert" hidden></p>
          <button type="submit">Sign in</button>
        </form>
      </section>
    </main>

    <main id="app-shell" class="app-shell" hidden>
      <nav class="navigation-rail" aria-label="Primary navigation">
        <a class="brand-mark" href="/" aria-label="ChatHSBC home">
          <img src="/assets/chatgpt-logo.png" alt="" />
        </a>
        <button class="nav-button is-active" type="button" aria-label="New chat">✎</button>
        <button class="nav-button" type="button" aria-label="Search" disabled>⌕</button>
      </nav>

      <section class="workspace" aria-label="Chat workspace">
        <header class="topbar">
          <div class="mode-switch" aria-label="Chat mode">
            <span class="is-selected">Chat</span><span>Work</span>
          </div>
          <div class="connection">
            <label for="endpoint">Endpoint</label>
            <input id="endpoint" name="endpoint" type="url" value="http://127.0.0.1:8787/mcp" />
            <button id="connect-button" type="button">Connect</button>
            <button id="logout-button" class="logout-button" type="button">Log out</button>
          </div>
        </header>

        <div class="content-grid">
          <section class="chat-panel" aria-label="Chat">
            <div id="chat-log" class="chat-log" aria-live="polite"></div>
            <form id="chat-form" class="composer">
              <div class="composer-entry">
                <div
                id="message-input"
                name="message"
                class="message-input is-empty"
                contenteditable="true"
                role="textbox"
                aria-multiline="false"
                autocomplete="off"
                aria-label="Chat message"
                data-placeholder="Message ChatHSBC, or type @ to add HSBC Mortgages"
                ></div>
                <div id="mention-menu" class="mention-menu" role="listbox" aria-label="Available apps" hidden>
                  <button id="hsbc-mention-option" type="button" class="mention-option" role="option" aria-selected="false">
                    <img src="/assets/hsbc-logo.png" alt="" />
                    <span><strong>HSBC Mortgages</strong><small>Explore what you could borrow</small></span>
                  </button>
                </div>
              </div>
              <button class="send-button" type="submit" aria-label="Send message">↑</button>
            </form>
          </section>

          <aside class="side-panel" aria-label="MCP details">
            <section class="panel-section">
              <div class="section-heading">
                <h2>Connection</h2>
                <span id="status-pill" class="status-pill" data-status="idle">Idle</span>
              </div>
              <dl class="status-list">
                <div>
                  <dt>MCP</dt>
                  <dd id="server-name">Not connected</dd>
                </div>
                <div>
                  <dt>Tool</dt>
                  <dd id="tool-name">calculate_mortgage_repayment</dd>
                </div>
              </dl>
            </section>

            <section class="panel-section result-section">
              <div class="section-heading">
                <h2>Last Result</h2>
                <button id="clear-button" type="button">Clear</button>
              </div>
              <div id="result-metrics" class="metrics empty-state">No result yet</div>
              <details>
                <summary>Raw JSON</summary>
                <pre id="raw-output">{}</pre>
              </details>
            </section>
          </aside>
        </div>
      </section>
    </main>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
