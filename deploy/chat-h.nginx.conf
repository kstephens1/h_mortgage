limit_req_zone $binary_remote_addr zone=chat_h_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=chat_h_chat:10m rate=30r/m;
map $http_origin $chat_h_cors_origin {
    default "";
    "https://chat-h-prod-ks-2026.web.app" $http_origin;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat-h.35.211.52.83.nip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/chat-h-certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat-h.35.211.52.83.nip.io;

    ssl_certificate /etc/letsencrypt/live/chat-h.35.211.52.83.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat-h.35.211.52.83.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:chat_h_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 64k;

    location = /auth/login {
        limit_req zone=chat_h_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:5174;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5174;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /chat {
        limit_req zone=chat_h_chat burst=10 nodelay;
        proxy_pass http://127.0.0.1:5174;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp {
        error_page 418 = @chat_h_mcp_options;
        if ($request_method = OPTIONS) {
            return 418;
        }

        auth_request /_chat_h_auth;
        proxy_pass http://127.0.0.1:8787;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Vary;
        add_header Access-Control-Allow-Origin $chat_h_cors_origin always;
        add_header Access-Control-Allow-Methods "POST, GET, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "authorization, content-type, mcp-protocol-version, mcp-session-id" always;
        add_header Access-Control-Expose-Headers "mcp-session-id" always;
        add_header Vary "Origin" always;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location @chat_h_mcp_options {
        proxy_pass http://127.0.0.1:8787;
        include proxy_params;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Vary;
        add_header Access-Control-Allow-Origin $chat_h_cors_origin always;
        add_header Access-Control-Allow-Methods "POST, GET, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "authorization, content-type, mcp-protocol-version, mcp-session-id" always;
        add_header Access-Control-Expose-Headers "mcp-session-id" always;
        add_header Vary "Origin" always;
    }

    location = /_chat_h_auth {
        internal;
        proxy_pass http://127.0.0.1:5174/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 404;
    }
}
